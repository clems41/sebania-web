<!-- Overlay pour mobile quand la sidebar est ouverte -->
@if (isMobile && isOpen) {
  <div class="fixed inset-0 backdrop-blur-sm z-30"
       style="background-color: rgba(0, 0, 0, 0.05);"
       (click)="onOverlayClick($event)"
       (touchend)="onOverlayClick($event)"></div>
}

<div class="flex flex-row">
  <!-- Sidebar -->
  <div class="fixed left-0 h-full flex flex-col z-50 bg-grisAnthra"
       [ngClass]="{
         'w-64': (!isCollapsed && !isMobile) || (isMobile),
         'w-16': isCollapsed && !isMobile,
         'transition-transform duration-300 ease-in-out': isMobile,
         '-translate-x-full': isMobile && !isOpen,
         'translate-x-0': !isMobile || (isMobile && isOpen)
       }"
       (click)="$event.stopPropagation()">
    <!-- En-tête avec bouton de repli -->
    <div class="bg-grisAnthra text-gray200 p-4 grid grid-cols-3 items-center">
      <div></div>
      <h2 [class.hidden]="(isCollapsed && !isMobile)" class="text-center">MENU</h2>
      <div class="flex justify-end">
        <button (click)="toggleCollapse()" class="p-1 hover:bg-gray700 rounded">
          <i *ngIf="!isMobile && !isCollapsed" class="bi bi-chevron-double-left h-7 w-7"></i>
          <i *ngIf="!isMobile && isCollapsed" class="bi bi-chevron-double-right h-7 w-7"></i>
          <i *ngIf="isMobile" class="bi bi-x-lg h-7 w-7"></i>
        </button>
      </div>
    </div>

    <!-- Contenu de la barre latérale -->
    <div class="text-gray200 flex-grow overflow-y-auto">
      <!-- Section ACTIVITES -->
      <div class="p-4">
        <h3 [class.text-xs]="isCollapsed" [class.text-center]="isCollapsed" class="text-gray400 font-bold mb-2">
          {{ isCollapsed ? 'ACT' : 'ACTIVITES' }}
        </h3>
        <nav>
          <a routerLink="/activites/accueil" routerLinkActive="bg-gray600"
             class="flex items-center p-2 rounded hover:bg-gray600 mb-1 transition-all duration-200 ease-in-out group"
             (click)="onNavigationClick()">
            <i class="bi bi-house-door-fill h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
            <span [class.hidden]="isCollapsed" class="ml-2">Aujourd'hui</span>
          </a>
          <a routerLink="/activites/calendrier" routerLinkActive="bg-gray600"
             class="flex items-center p-2 rounded hover:bg-gray600 mb-1 transition-all duration-200 ease-in-out group"
             (click)="onNavigationClick()">
            <i class="bi bi-calendar3 h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
            <span [class.hidden]="isCollapsed" class="ml-2">Calendrier</span>
          </a>
          <a routerLink="/activites/saisie" routerLinkActive="bg-gray600"
             class="flex items-center p-2 rounded hover:bg-gray600 mb-1 transition-all duration-200 ease-in-out group"
             (click)="onNavigationClick()">
            <i class="bi bi-pencil-fill h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
            <span [class.hidden]="isCollapsed" class="ml-2">Saisir une activité</span>
          </a>
        </nav>
      </div>

      @if (!isMobile) {
        <!-- Section TABLEAU DE BORD -->
        <div class="p-4">
          <h3 [class.text-xs]="isCollapsed" [class.text-center]="isCollapsed" class="text-gray400 font-bold mb-2">
            {{ isCollapsed ? 'TDB' : 'TABLEAU DE BORD' }}
          </h3>
          <nav>
            <a routerLink="/tableau-bord/vue-ensemble" routerLinkActive="bg-gray600"
               class="flex items-center p-2 rounded hover:bg-gray600 mb-1 transition-all duration-200 ease-in-out group"
               (click)="onNavigationClick()">
              <i class="bi bi-eye-fill h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
              <span [class.hidden]="isCollapsed" class="ml-2">Vue d'ensemble</span>
            </a>
            <a routerLink="/tableau-bord/temps-travail" routerLinkActive="bg-gray600"
               class="flex items-center p-2 rounded hover:bg-gray600 mb-1 transition-all duration-200 ease-in-out group"
               (click)="onNavigationClick()">
              <i class="bi bi-clock-fill h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
              <span [class.hidden]="isCollapsed" class="ml-2">Temps de travail</span>
            </a>
            <a routerLink="/tableau-bord/cultures" routerLinkActive="bg-gray600"
               class="flex items-center p-2 rounded hover:bg-gray600 mb-1 transition-all duration-200 ease-in-out group"
               (click)="onNavigationClick()">
              <i class="bi bi-basket-fill h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
              <span [class.hidden]="isCollapsed" class="ml-2">Par culture</span>
            </a>
            <a routerLink="/tableau-bord/parcelles" routerLinkActive="bg-gray600"
               class="flex items-center p-2 rounded hover:bg-gray600 mb-1 transition-all duration-200 ease-in-out group"
               (click)="onNavigationClick()">
              <i class="bi bi-grid-1x2 h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
              <span [class.hidden]="isCollapsed" class="ml-2">Par parcelle</span>
            </a>
            <a routerLink="/tableau-bord/comparaison" routerLinkActive="bg-gray600"
               class="flex items-center p-2 rounded hover:bg-gray600 mb-1 transition-all duration-200 ease-in-out group"
               (click)="onNavigationClick()">
              <i class="bi bi-speedometer h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
              <span [class.hidden]="isCollapsed" class="ml-2">Comparaison</span>
            </a>
          </nav>
        </div>
      }


    </div>
  </div>
</div>

<!-- Spacer pour desktop uniquement -->
@if (!isMobile) {
  <div [class.w-64]="!isCollapsed" [class.w-16]="isCollapsed"></div>
}
