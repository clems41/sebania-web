<div class="min-h-screen flex flex-col">
  <app-top-bar [isMobile]="isMobile" (toggleSidebar)="toggleSidebar()"></app-top-bar>
  <div class="flex flex-1">
    <app-lateral-bar [isMobile]="isMobile" #lateralBarRef></app-lateral-bar>
    <main class="flex-1 p-4 overflow-auto" [ngClass]="{'w-1/2': !isMobile}">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
