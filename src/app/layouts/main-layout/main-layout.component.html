<div class="min-h-screen flex flex-col">
  <app-top-bar [isMobile]="isMobile"></app-top-bar>
  <div class="flex flex-1">
    <app-lateral-bar [isMobile]="isMobile"></app-lateral-bar>
    <main class="flex-1 p-4 overflow-auto">
      @if (isMobile) {
        <div class="flex flex-col items-center m-2 space-y-5">
          <div class="text-xl ">
            <span>
              Pour une utilisation optimale sur mobile, nous vous recommandons de télécharger l'application depuis le store.
            </span>
          </div>
          @if (isAndroid) {
            <div>
              <img ngSrc="assets/images/play_store.png" alt="app_store" height="122" width="412">
            </div>
          } @else {
            <div>
              <img ngSrc="assets/images/app_store.png" alt="app_store" height="380" width="1200">
            </div>
          }
        </div>
      } @else {
        <router-outlet></router-outlet>
      }
    </main>
  </div>
</div>
