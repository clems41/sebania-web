<div class="fixed top-0 left-0 right-0 z-50 bg-white shadow-md">
  <div class="bg-brunTerre text-gray100 h-16 flex items-center justify-between px-4 shadow-lg">
    <!-- Bouton hamburger mobile + Logo -->
    <div class="flex items-center space-x-3">
      <!-- Bouton hamburger (mobile uniquement) -->
      @if (isMobile) {
        <button (click)="onToggleSidebar()"
                class="flex items-center justify-center p-2 rounded-lg hover:bg-grisAnthra active:bg-grisAnthra transition-all duration-200">
          <i class="bi bi-list h-6 w-6"></i>
        </button>
      }

      <!-- Logo -->
      <a href="/public" class="flex items-center space-x-2 hover:opacity-80 transition-opacity duration-200">
        <img ngSrc="assets/images/logo.png" alt="Logo" height="50" width="50">
        <span [ngClass]="isMobile ? 'text-xl' : 'text-2xl'" class="font-semibold text-vertFeuille">Sebania</span>
      </a>
    </div>

    <!-- Menu à droite -->
    <div class="flex items-center space-x-1">
      @if (!isMobile) {
        <!-- Paramètres -->
        <a routerLink="/parametres"
           routerLinkActive="bg-grisAnthra"
           class="flex items-center space-x-2 px-3 py-2 rounded-lg hover:bg-grisAnthra active:bg-grisAnthra
                    transition-all duration-200 ease-in-out group">
          <i class="bi bi-gear-fill h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
          <span class="font-light text-sm group-hover:text-gray200">Paramètres</span>
        </a>
      }

      <!-- Se déconnetecer -->
      <button (click)="logout()"
              class="flex items-center space-x-2 px-3 py-2 rounded-lg hover:bg-grisAnthra active:bg-grisAnthra
                    transition-all duration-200 ease-in-out group hover:cursor-pointer">
        <i class="bi bi-box-arrow-left h-5 w-5 group-hover:scale-110 transition-transform duration-200"></i>
        @if (!isMobile) {
          <span class="font-light text-sm group-hover:text-gray200">Se déconnecter</span>
        }
      </button>
    </div>
  </div>
</div>
<div class="h-[64px]"></div> <!-- Ajustez la hauteur selon celle de la top-bar -->
