<div class="w-[393px] bg-gray50 rounded-lg shadow-lg flex flex-col">
  <div class="w-full">
    <img
      ngSrc="assets/images/banner.png"
      alt="Bannière"
      width="393"
      height="144"
      priority
      class="w-full object-cover rounded-t-lg"
    >
  </div>
  <div class="p-6 flex-grow flex flex-col">
    <div class="flex items-center justify-center relative mb-8">
      <p-button icon="pi pi-arrow-circle-left"
                (click)="toConnexion()" [rounded]="true"
                [raised]="true"
                styleClass="bg-grisAnthra! border-grisAnthra!"
                class="absolute left-0"
      />
      <h2 class="text-2xl font-bold">INSCRIPTION</h2>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <p-floatlabel variant="on">
          <label for="email">Email<span class="text-suppression"> *</span></label>
          <input pInputText type="email"
                 formControlName="email"
                 id="email"
                 name="email"
                 fluid
                 required>
        </p-floatlabel>
      </div>

      <div>
        <p-floatlabel variant="on">
          <p-password formControlName="password" inputId="on_label" [toggleMask]="true"
                      promptLabel="Choisir un mot de passe"
                      weakLabel="Faible"
                      mediumLabel="Moyen"
                      strongLabel="Fort"
                      fluid
          />
          <label for="on_label">Mot de passe<span class="text-suppression"> *</span></label>
        </p-floatlabel>
      </div>

      <div class="flex items-center justify-center relative space-x-4">
        <p-floatlabel variant="on">
          <label for="first_name">Prénom<span class="text-suppression"> *</span></label>
          <input pInputText type="text"
                 formControlName="first_name"
                 id="first_name"
                 name="first_name"
                 fluid
                 required>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <label for="last_name">Nom<span class="text-suppression"> *</span></label>
          <input pInputText type="text"
                 formControlName="last_name"
                 id="last_name"
                 name="last_name"
                 fluid
                 required>
        </p-floatlabel>
      </div>

      <div>
        <p-floatlabel variant="on">
          <label for="ferme_nom">Nom de la ferme<span class="text-suppression"> *</span></label>
          <input pInputText type="text"
                 formControlName="ferme_nom"
                 id="ferme_nom"
                 name="ferme_nom"
                 fluid
                 required>
        </p-floatlabel>
      </div>

      <div class="flex items-center justify-center relative space-x-4">
        <p-floatlabel variant="on">
          <p-inputnumber formControlName="ferme_code_postal"
                         min="0" fluid inputId="integeronly"
                         format="false"
                         fluid
                         required>
          </p-inputnumber>
          <label for="ferme_code_postal">Code postal<span
            class="text-suppression"> *</span></label>
        </p-floatlabel>

        <p-floatlabel variant="on">
          <p-inputnumber formControlName="ferme_superficie_cultivee"
                         min="0" fluid inputId="locale-user"
                         fluid
                         required>
          </p-inputnumber>
          <label for="ferme_superficie_cultivee">Superficie (m²)</label>
        </p-floatlabel>
      </div>

      <div>
        <p-floatlabel variant="on">
          <p-multiselect [options]="methodesAgricoles" formControlName="ferme_methodes_agricoles" optionValue="id"
                         optionLabel="nom"
                         display="chip"
                         fluid>
          </p-multiselect>
          <label for="ferme_nom">Méthodes agricoles</label>
        </p-floatlabel>
      </div>

      <div>
        <p-button label="INSCRIPTION" type="submit"
                  [disabled]="registerForm.invalid || loading"
                  [raised]="registerForm.invalid || loading"
                  [loading]="loading"
                  fluid
        />
      </div>

    </form>

  </div>
</div>
