<div class="w-full w-max-md bg-gray50 rounded-lg shadow-lg flex flex-col">
  <div class="w-full">
    <img
      ngSrc="assets/images/banner.png"
      alt="Bannière"
      width="393"
      height="144"
      priority
      class="w-full object-cover rounded-t-lg"
    >
  </div>
  <div class="p-6 flex-grow flex flex-col">
    <div class="flex items-center justify-center relative mb-8">
      <p-button icon="pi pi-arrow-circle-left"
                (click)="toConnexion()" [rounded]="true"
                [raised]="true"
                styleClass="bg-grisAnthra! border-grisAnthra!"
                class="absolute left-0"
      />
      <h2 class="text-2xl font-bold">Mot de passe oublié</h2>
    </div>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <p-floatlabel variant="on">
          <label for="email">Email</label>
          <input pInputText type="email"
                 formControlName="email"
                 id="email"
                 name="email"
                 fluid
                 required>
        </p-floatlabel>
      </div>
      <p-button label="Réinitialiser son mot de passe" type="submit"
                [disabled]="resetForm.invalid || loading"
                [raised]="resetForm.invalid || loading"
                [loading]="loading"
                fluid
      />

    </form>

    <div class="pt-20">
      <p-button label="Se connecter"
                styleClass="bg-intermediaire! border-intermediaire!"
                [disabled]="resetForm.invalid || loading"
                [raised]="resetForm.invalid || loading"
                [loading]="loading"
                fluid
                (click)="toConnexion()"
      />
    </div>
  </div>
</div>
