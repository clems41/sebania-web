<div class="w-full max-w-md p-6 bg-white rounded-lg shadow-lg">
  <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">Connexion</h2>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email"
             id="email"
             name="email"
             [(ngModel)]="email"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
             required>
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
      <input type="password"
             id="password"
             name="password"
             [(ngModel)]="password"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
             required>
    </div>

    <button type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
      Se connecter
    </button>
  </form>

  <h3 class="text-l font-bold text-center text-gray-800 mb-8">Pas encore de compte ?</h3>
  <button (click)="toInscription()"
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
    Inscription
  </button>
</div>
