<div class="flex flex-col items-center justify-center w-full">
  <p-confirmdialog></p-confirmdialog>
  <div class="w-full">
    <p-table #dt2 [value]="employes" size="small" stripedRows
             [scrollable]="true" scrollHeight="40rem"
    >
      <ng-template #header>
        <tr>
          <th style="width:25%">
            Prénom
          </th>
          <th style="width:25%">
            Nom
          </th>
          <th style="width:50%">
            Email
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-employe >
        <tr>
          <td>{{ employe.first_name }}</td>
          <td>{{ employe.last_name }}</td>
          <td>{{ employe.email }}</td>
          <td>
            <p-button icon="pi pi-trash"
                      (click)="onDeleteEmploye($event, employe)" [rounded]="true"
                      [raised]="true"
                      styleClass="bg-suppression! border-suppression! transition-all! hover:scale-110!"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <div class="m-2 bottom-10 w-full flex flex-col items-center">
    <p-button label="Ajouter un nouvel employé" icon="pi pi-plus" (onClick)="showDialog()"
              styleClass="transition-all! hover:scale-105!"
    />
  </div>
</div>
