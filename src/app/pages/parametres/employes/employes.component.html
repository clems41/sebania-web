<div class="flex flex-row justify-center w-full">

  <div class="p-6 justify-center">
    <form [formGroup]="employeForm" (ngSubmit)="onSubmit()" class="space-y-3">
      <div>
        <p-floatlabel variant="on">
          <label for="email">Email<span class="text-suppression"> *</span></label>
          <input pInputText type="email"
                 formControlName="email"
                 id="email"
                 name="email"
                 fluid
                 required>
        </p-floatlabel>
      </div>

      <div class="flex items-center justify-center relative space-x-2">
        <p-floatlabel variant="on">
          <label for="first_name">Prénom<span class="text-suppression"> *</span></label>
          <input pInputText type="text"
                 formControlName="first_name"
                 id="first_name"
                 name="first_name"
                 fluid
                 required>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <label for="last_name">Nom<span class="text-suppression"> *</span></label>
          <input pInputText type="text"
                 formControlName="last_name"
                 id="last_name"
                 name="last_name"
                 fluid
                 required>
        </p-floatlabel>
      </div>

      <p-button label="Ajouter un nouvel employé" type="submit"
                [disabled]="employeForm.invalid || loading"
                [raised]="employeForm.invalid || loading"
                [loading]="loading"
                fluid
      />

    </form>
  </div>

  <div class="h-screen overflow-y-auto">
    <p-scrollpanel  [style]="{ width: '100%', height: '80%' }">
      <p-card *ngFor="let employe of employes" header="{{employe.first_name}} {{employe.last_name}}"
              styleClass="min-w-sm! m-2"
      >
        <div class="flex flex-row justify-between items-center">
          <p class="m-0">
            {{ employe.email }}
          </p>
          <p-button icon="pi pi-trash"
                    (click)="onDeleteEmploye(employe)" [rounded]="true"
                    [raised]="true"
                    styleClass="bg-suppression! border-suppression!"
                    class="transition-all hover:scale-110"
          />
        </div>
      </p-card>
    </p-scrollpanel>
  </div>

</div>
